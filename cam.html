<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Shanyraq Family: камера</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@500;600;700&display=swap">
<style>
/* Телефон-камера. Два режима: «общая камера у телевизора» (до 4 сохранённых игроков) и «мой телефон» (один игрок, свой номер). */
:root{--bg:#0b0f2e;--bg2:#141a45;--ink:#f4f6ff;--ink2:#aab3e6;--brand:#3b5bff;--good:#2ee59d;--bad:#ff5a7a;--gold:#ffd84d;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;--f-body:"Onest",-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body)}
body{min-height:100vh;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
h1{font:800 20px var(--f-display);margin:0}
h1 span{color:#53b4ff}
.card{background:var(--bg2);border-radius:18px;padding:14px;display:grid;gap:10px;min-width:0}
.card>*{min-width:0}
label.l{font-size:13px;color:var(--ink2);display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{flex:1 1 120px;width:100%;min-width:0;font:800 26px var(--f-display);letter-spacing:.15em;text-align:center;background:#0b0f2e;border:2px solid #2a347a;border-radius:14px;color:var(--ink);padding:10px}
input:focus{outline:3px solid var(--gold);outline-offset:2px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{flex:none;border:0;background:linear-gradient(135deg,var(--brand),#7b5cff);color:#fff;font:700 16px var(--f-body);padding:14px 18px;border-radius:14px}
.ghost{border:2px solid #3a4590;background:transparent;color:var(--ink);font-weight:700;padding:10px 12px;border-radius:12px;font-size:14px}
.seg{display:inline-flex;background:#0b0f2e;border-radius:16px;padding:4px;flex-wrap:wrap;max-width:100%}
.seg.wide{display:grid;grid-template-columns:1fr 1fr}
.seg.wide button{white-space:normal;line-height:1.25}
.seg button{border:0;background:transparent;color:var(--ink2);padding:8px 12px;border-radius:999px;font-weight:700;font-size:13px}
.seg button.on{background:var(--brand);color:#fff}
.status{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.status i{width:10px;height:10px;border-radius:50%;background:var(--bad);flex:none}
.status.ok i{background:var(--good)}
.cam{position:relative;width:100%;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:#000}
@media (orientation:landscape){.cam{aspect-ratio:16/9;max-height:70vh}}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.banner{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(11,15,46,.82);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:600;text-align:center}
.pls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pl{border-radius:12px;padding:8px 4px;text-align:center;font-weight:700;font-size:12.5px;background:#0b0f2e;border:2px solid currentColor;opacity:.35;display:grid;gap:6px}
.pl.on{opacity:1}
.pl.saved{background:#162058}
.pl button{border:0;border-radius:8px;padding:6px 4px;font-weight:700;font-size:12px;background:#26306e;color:var(--ink)}
.hint{font-size:13px;color:var(--ink2);margin:0}
.hidden{display:none!important}
</style>
</head>
<body>
<h1>Shanyraq <span>Family</span> · <span data-t="title"></span></h1>

<div class="card" id="joinCard">
  <label class="l" for="code" data-t="code"></label>
  <div class="row"><input id="code" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000"><button class="btn" id="joinBtn" type="button" data-t="join"></button></div>
  <label class="l" data-t="modeLbl"></label>
  <div class="seg wide" role="group"><button type="button" data-mode="shared" class="on" data-t="modeShared"></button><button type="button" data-mode="personal" data-t="modePersonal"></button></div>
  <div class="row hidden" id="myIdRow"><label class="l" data-t="myId" style="margin:0"></label><div class="seg" role="group" id="myIdSeg"></div></div>
  <div class="row" style="justify-content:space-between">
    <div class="seg" role="group"><button type="button" data-cam="user" class="on" data-t="camFront"></button><button type="button" data-cam="environment" data-t="camBack"></button></div>
    <div class="seg" role="group"><button type="button" data-lang="ru" class="on">RU</button><button type="button" data-lang="kz">KZ</button></div>
  </div>
</div>

<div class="status" id="status" role="status"><i></i><span id="statusTxt"></span></div>
<div class="cam hidden" id="camBox"><video id="video" playsinline muted></video><canvas id="overlay"></canvas><div class="banner" id="banner"></div></div>
<div class="pls hidden" id="pls"></div>
<div class="row hidden" id="tools"><button class="ghost" id="resetBtn" type="button" data-t="reset"></button><button class="ghost" id="flipBtn" type="button" data-t="flip"></button></div>
<p class="hint" id="hint"></p>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ================== ТЕКСТЫ ================== */
const TX={ru:{title:"камера",code:"Код комнаты с экрана",join:"Подключить",modeLbl:"Как играем",modeShared:"Одна камера у телевизора",modePersonal:"У каждого свой телефон",myId:"Мой номер",
  camFront:"Фронтальная",camBack:"Задняя",reset:"Сбросить игроков",flip:"Сменить камеру",player:"Игрок",save:"Сохранить",saved:"сохранён",
  hintShared:"Телефон у телевизора камерой к игрокам, 2–3 метра, хороший свет. Каждый игрок поднимает обе руки на секунду — так он сохраняется под своим номером.",
  hintPersonal:"Поставьте телефон перед собой так, чтобы камера видела вас по пояс. Вы играете под выбранным номером.",
  bReg:"Поднимите обе руки на 1 секунду, чтобы стать игроком",bFull:"Все 4 места заняты. Нажмите «Сбросить игроков», чтобы начать заново",bPlay:"Игра идёт: поднимите одну руку со стороны ответа",bNone:"Встаньте в кадр целиком или по пояс",
  off:"Не подключено",connecting:"Подключаемся к экрану…",loading:"Загружаем распознавание движений…",on:"Подключено к экрану",lost:"Связь с экраном потеряна — подключитесь снова",
  badCode:"Введите 4 цифры кода с экрана",noScreen:"Экран с таким кодом не найден. Проверьте код на телевизоре",errCam:"Камера недоступна: разрешите доступ к камере",errModel:"Не загрузилось распознавание движений. Проверьте интернет",
  regDone:"сохранён как игрок",noOne:"Никого не вижу: встаньте в кадр"},
 kz:{title:"камера",code:"Экрандағы бөлме коды",join:"Қосылу",modeLbl:"Қалай ойнаймыз",modeShared:"Теледидар жанында бір камера",modePersonal:"Әркімде өз телефоны",myId:"Менің нөмірім",
  camFront:"Алдыңғы",camBack:"Артқы",reset:"Ойыншыларды тазалау",flip:"Камераны ауыстыру",player:"Ойыншы",save:"Сақтау",saved:"сақталды",
  hintShared:"Телефонды теледидардың жанына камерасын ойыншыларға қаратып қойыңыз, 2–3 метр, жарық жер. Әр ойыншы екі қолын бір секундқа көтереді — осылай өз нөмірімен сақталады.",
  hintPersonal:"Телефонды камера сізді белге дейін көретіндей алдыңызға қойыңыз. Сіз таңдалған нөмірмен ойнайсыз.",
  bReg:"Ойыншы болу үшін екі қолыңызды 1 секундқа көтеріңіз",bFull:"4 орынның бәрі бос емес. Қайта бастау үшін «Ойыншыларды тазалау» басыңыз",bPlay:"Ойын жүріп жатыр: жауап жағындағы бір қолыңызды көтеріңіз",bNone:"Кадрға толық немесе белге дейін кіріңіз",
  off:"Қосылмаған",connecting:"Экранға қосылуда…",loading:"Қозғалысты тану жүктелуде…",on:"Экранға қосылды",lost:"Экранмен байланыс үзілді — қайта қосылыңыз",
  badCode:"Экрандағы кодтың 4 санын енгізіңіз",noScreen:"Бұл кодпен экран табылмады. Теледидардағы кодты тексеріңіз",errCam:"Камера қолжетімсіз: камераға рұқсат беріңіз",errModel:"Қозғалысты тану жүктелмеді. Интернетті тексеріңіз",
  regDone:"ойыншы ретінде сақталды",noOne:"Ешкімді көрмеймін: кадрға кіріңіз"}};
const qs=new URLSearchParams(location.search);
let L=qs.get("lang")==="kz"?"kz":"ru";const tx=k=>TX[L][k];
const $=id=>document.getElementById(id);

/* ================== НАСТРОЙКИ РАСПОЗНАВАНИЯ ================== */
const COLORS=["#ff7a59","#53b4ff","#b98cff","#2ee59d"], GREY="#8088b0";
const MAXP=4;
const REG_HOLD_MS=1000;      // обе руки вверх — столько держать, чтобы сохраниться
const RAISE_ON=.55, RAISE_OFF=.35; // кисть выше плеча на долю длины туловища: поднять / опустить (с запасом)
const MOVE_FAST=1.2;          // скорость в длинах туловища за секунду — «человек быстро двигается»
const MATCH_MAX=1.6;          // дороже — не считаем человека этим игроком
let mode="shared", myId=1, phase="lobby";

/* ================== ВНЕШНОСТЬ: оттенки одежды верха и низа ==================
   Гистограмма HSV: 6 оттенков × 2 насыщенности + 3 уровня серого (чёрное, серое, белое) = 15 корзин на верх и 15 на низ. */
function hsvBin(r,g,b){
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),v=mx/255,s=mx?(mx-mn)/mx:0;
  if(s<.25||v<.2)return 12+(v<.33?0:v<.66?1:2);
  let h;const d=mx-mn;if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h=(h*60+360)%360;
  return Math.floor(h/60)*2+(s<.6?0:1);
}
function regionHist(img,W,H,x0,x1,y0,y1){
  const hst=new Array(15).fill(0);let n=0;
  const ax=Math.max(0,Math.floor(x0*W)),bx=Math.min(W-1,Math.ceil(x1*W)),ay=Math.max(0,Math.floor(y0*H)),by=Math.min(H-1,Math.ceil(y1*H));
  for(let y=ay;y<=by;y++)for(let x=ax;x<=bx;x++){const i=(y*W+x)*4;hst[hsvBin(img[i],img[i+1],img[i+2])]++;n++;}
  return n?hst.map(v=>v/n):null;
}
function bodyHist(lm,img,W,H){
  const ls=lm[11],rs=lm[12],lh=lm[23],rh=lm[24],lk=lm[25],rk=lm[26];
  const x0=Math.min(ls.x,rs.x),x1=Math.max(ls.x,rs.x),sw=x1-x0;
  const yS=Math.min(ls.y,rs.y),yH=(lh&&rh)?Math.max(lh.y,rh.y):yS+sw*1.3;
  const up=regionHist(img,W,H,x0+sw*.2,x1-sw*.2,yS+(yH-yS)*.15,yS+(yH-yS)*.85);
  const yK=(lk&&rk&&(lk.visibility===undefined||lk.visibility>.4))?Math.max(lk.y,rk.y):yH+(yH-yS)*.6;
  const lo=regionHist(img,W,H,x0+sw*.15,x1-sw*.15,yH+(yK-yH)*.1,yH+(yK-yH)*.7);
  if(!up)return null;
  return up.map(v=>v*.6).concat((lo||up).map(v=>v*.4));
}
/* расстояние между внешностями: 0 — одинаково, 1 — совсем разное (Бхаттачарья) */
function appDist(a,b){if(!a||!b)return .5;let bc=0;for(let i=0;i<a.length;i++)bc+=Math.sqrt(a[i]*b[i]);return Math.sqrt(Math.max(0,1-bc));}
function mixHist(a,b,k){return a.map((v,i)=>v*(1-k)+b[i]*k);}

/* ================== ГЕОМЕТРИЯ ПОЗЫ ================== */
const vis=p=>p&&(p.visibility===undefined||p.visibility>.5);
function torsoLen(lm){
  const ms={x:(lm[11].x+lm[12].x)/2,y:(lm[11].y+lm[12].y)/2};
  if(vis(lm[23])&&vis(lm[24])){const mh={x:(lm[23].x+lm[24].x)/2,y:(lm[23].y+lm[24].y)/2};return Math.max(.04,Math.hypot(ms.x-mh.x,ms.y-mh.y));}
  return Math.max(.04,Math.abs(lm[11].x-lm[12].x)*1.4);
}
/* Насколько поднята рука с каждой СТОРОНЫ экрана.
   Не доверяем подписям модели «левое/правое запястье» — на расстоянии она их путает.
   Берём оба запястья, смотрим, какое поднято, и определяем сторону по тому, где оно относительно середины тела.
   На экране картинка зеркальная (как в зеркале): левая рука человека — слева. В исходном кадре это x больше середины. */
function sideLifts(lm,tl){
  const cx=(lm[11].x+lm[12].x)/2, shY=(lm[11].y+lm[12].y)/2;
  const out={L:0,R:0};
  [[13,15],[14,16]].forEach(([e,w])=>{
    const wr=lm[w],el=lm[e];if(!vis(wr))return;
    const lift=(shY-wr.y)/tl;
    const elbowUp=vis(el)?(shY-el.y)/tl>-.05:true;
    const upright=Math.abs(wr.x-cx)/tl<1.4;
    const val=(elbowUp&&upright)?lift:Math.min(lift,0);
    const side=wr.x>cx?"L":"R";
    if(val>out[side])out[side]=val;
  });
  return out;
}
/* ================== ИГРОКИ ================== */
let profiles=[];   // сохранённые игроки: {id,hist,x,y,tl,vx,vy,last,lm,hyst:{L,R},raise,moving,both}
let guests=[];     // люди в кадре, которые ещё не игроки: {x,y,tl,hist,bothSince,last,lm}
let events=[];
function freeId(){for(let i=1;i<=MAXP;i++)if(!profiles.some(p=>p.id===i))return i;return 0;}
function makeProfile(id,d,now){
  profiles=profiles.filter(p=>p.id!==id);
  const p={id,hist:d.hist?d.hist.slice():null,x:d.x,y:d.y,tl:d.tl,vx:0,vy:0,last:now,lm:d.lm,hyst:{L:false,R:false},raise:null,moving:false,both:false};
  profiles.push(p);events.push({t:"reg",id});return p;
}
function perms(n,k){const out=[];const rec=(a,used)=>{if(a.length===k){out.push(a.slice());return;}for(let i=0;i<n;i++)if(!used[i]){used[i]=1;a.push(i);rec(a,used);a.pop();used[i]=0;}};rec([],[]);return out;}
/* Распределение: перебираем все варианты «кто есть кто» и берём самый дешёвый.
   Цена = непохожесть одежды + отклонение от того места, куда игрок должен был сдвинуться. */
function assign(dets,now){
  const P=profiles,res=new Array(dets.length).fill(null);
  if(!P.length||!dets.length)return res;
  const cost=(d,p)=>{
    const dt=Math.min(1,(now-p.last)/1000),px=p.x+p.vx*dt,py=p.y+p.vy*dt;
    const pos=Math.min(2,Math.hypot(d.x-px,d.y-py)/(p.tl*1.5));
    const lostFor=now-p.last;const posW=lostFor>1500?.15:.6;   // давно не видели — решает одежда
    return 2*appDist(d.hist,p.hist)+posW*pos;
  };
  const k=Math.min(P.length,dets.length);
  let best=null,bc=1e9;
  // выбираем, каких k игроков сопоставить с какими k людьми
  for(const pp of perms(P.length,k))for(const dd of perms(dets.length,k)){
    let c=0;for(let i=0;i<k;i++)c+=Math.min(MATCH_MAX+.5,cost(dets[dd[i]],P[pp[i]]));
    if(c<bc){bc=c;best=[pp,dd];}
  }
  if(best)for(let i=0;i<k;i++){const p=P[best[0][i]],di=best[1][i];if(cost(dets[di],p)<MATCH_MAX)res[di]=p;}
  return res;
}
function updateProfile(p,d,now){
  const dt=Math.max(.016,(now-p.last)/1000);
  const vx=(d.x-p.x)/dt,vy=(d.y-p.y)/dt;
  if(now-p.last<300){p.vx=p.vx*.6+vx*.4;p.vy=p.vy*.6+vy*.4;}else{p.vx=0;p.vy=0;}
  p.x=d.x;p.y=d.y;p.tl=p.tl*.8+d.tl*.2;p.last=now;
  if(d.hist&&p.hist&&appDist(d.hist,p.hist)<.35)p.hist=mixHist(p.hist,d.hist,.03);  // медленно подстраиваемся под свет
  // сглаживание точек, чтобы скелет не дрожал
  p.lm=p.lm&&p.lm.length===d.lm.length?d.lm.map((q,i)=>({x:p.lm[i].x*.4+q.x*.6,y:p.lm[i].y*.4+q.y*.6,visibility:q.visibility})):d.lm;
  const tl=torsoLen(p.lm);
  p.moving=Math.hypot(p.vx,p.vy)/Math.max(tl,.04)>MOVE_FAST;
  const lifts=sideLifts(p.lm,tl);
  for(const s of["L","R"]){const lift=lifts[s];if(!p.hyst[s]&&lift>RAISE_ON)p.hyst[s]=true;else if(p.hyst[s]&&lift<RAISE_OFF)p.hyst[s]=false;}
  p.both=p.hyst.L&&p.hyst.R;
  p.raise=p.both?null:p.hyst.L?"L":p.hyst.R?"R":null;
}
function updateGuests(unmatched,now){
  const next=[];
  unmatched.forEach(d=>{
    let g=null,bd=1e9;guests.forEach(x=>{const dd=Math.hypot(d.x-x.x,d.y-x.y)/Math.max(x.tl,.05);if(dd<bd&&dd<1.5){bd=dd;g=x;}});
    if(!g)g={bothSince:0,hist:null};
    const tl=torsoLen(d.lm),lf=sideLifts(d.lm,tl),both=lf.L>RAISE_ON&&lf.R>RAISE_ON;
    g.x=d.x;g.y=d.y;g.tl=d.tl;g.lm=d.lm;g.last=now;g.det=d;
    if(d.hist)g.hist=g.hist?mixHist(g.hist,d.hist,.3):d.hist.slice();
    g.bothSince=both?(g.bothSince||now):0;g.prog=both?Math.min(1,(now-g.bothSince)/REG_HOLD_MS):0;
    if(mode==="shared"&&both&&now-g.bothSince>=REG_HOLD_MS){const id=freeId();if(id){makeProfile(id,{...d,hist:g.hist},now);return;}}
    next.push(g);
  });
  guests=next;
}
/* один шаг: dets = [{lm,x,y,tl,hist}] → обновляем игроков; возвращает данные для экрана */
function frameStep(dets,now){
  if(mode==="personal"){
    const d=dets.slice().sort((a,b)=>b.tl-a.tl)[0];
    let p=profiles.find(x=>x.id===myId);
    if(d){if(!p)p=makeProfile(myId,d,now);updateProfile(p,d,now);}
    profiles=profiles.filter(x=>x.id===myId);guests=[];
  }else{
    const m=assign(dets,now);
    dets.forEach((d,i)=>{if(m[i])updateProfile(m[i],d,now);});
    updateGuests(dets.filter((d,i)=>!m[i]),now);
  }
  const seen=profiles.filter(p=>now-p.last<400);
  return seen.map(p=>({id:p.id,r:p.raise,m:p.moving?1:0,b:p.both?1:0}));
}
/* ручное сохранение: тот, кто поднял обе руки; иначе единственный незнакомец; иначе самый крупный незнакомец */
function saveManual(id){
  const now=performance.now();
  let g=guests.find(x=>x.prog>0)||(guests.length===1?guests[0]:null)||guests.slice().sort((a,b)=>b.tl-a.tl)[0];
  if(!g){const p=profiles.find(x=>x.id===id);if(p)return true;setBanner(tx("noOne"));return false;}
  makeProfile(id,{...g.det,hist:g.hist},now);guests=guests.filter(x=>x!==g);return true;
}

/* ================== КАМЕРА ================== */
const MP="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL="https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
const KEYS=[0,11,12,13,14,15,16,23,24,25,26,27,28];
let landmarker=null,stream=null,facing="user",lastT=-1;
const video=$("video"),canvas=$("overlay"),ctx=canvas.getContext("2d");
const sampler=document.createElement("canvas");sampler.width=160;sampler.height=120;const sctx=sampler.getContext("2d",{willReadFrequently:true});
async function initPose(){
  const vision=await import(MP+"/vision_bundle.mjs");
  const fs=await vision.FilesetResolver.forVisionTasks(MP+"/wasm");
  const o=d=>({baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:"VIDEO",numPoses:MAXP+1,minPoseDetectionConfidence:.5,minPosePresenceConfidence:.5,minTrackingConfidence:.5});
  try{landmarker=await vision.PoseLandmarker.createFromOptions(fs,o("GPU"));}catch(e){landmarker=await vision.PoseLandmarker.createFromOptions(fs,o("CPU"));}
}
async function startCamera(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;await video.play();
}
let lastSend=0;
function loop(){
  if(!landmarker)return;
  if(video.readyState>=2&&video.currentTime!==lastT){
    lastT=video.currentTime;const now=performance.now();
    const res=landmarker.detectForVideo(video,now);
    sctx.drawImage(video,0,0,sampler.width,sampler.height);
    const img=sctx.getImageData(0,0,sampler.width,sampler.height).data;
    const dets=(res.landmarks||[]).filter(lm=>vis(lm[11])&&vis(lm[12])).map(lm=>({lm,x:(lm[11].x+lm[12].x)/2,y:(lm[11].y+lm[12].y)/2,tl:torsoLen(lm),hist:bodyHist(lm,img,sampler.width,sampler.height)}));
    const out=frameStep(dets,now);
    draw();renderPlayers();updateBanner(dets.length);
    if(now-lastSend>66&&anyOpen()){lastSend=now;
      const ps=out.map(o=>{const p=profiles.find(x=>x.id===o.id);return {...o,k:KEYS.map(i=>[+(1-p.lm[i].x).toFixed(3),+p.lm[i].y.toFixed(3)])};});
      send({t:"p",mode,ps,ev:events.splice(0)});}
  }
  requestAnimationFrame(loop);
}
function drawBody(lm,col,label,prog,raise){
  const w=canvas.width,h=canvas.height;
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=5*devicePixelRatio;ctx.lineCap="round";
  BONES.forEach(([a,b])=>{const A=lm[a],B=lm[b];ctx.beginPath();ctx.moveTo(A.x*w,A.y*h);ctx.lineTo(B.x*w,B.y*h);ctx.stroke();});
  const n=lm[0];ctx.beginPath();ctx.arc(n.x*w,n.y*h,22*devicePixelRatio,0,7);ctx.fill();
  if(prog>0){ctx.strokeStyle="#ffd84d";ctx.lineWidth=6*devicePixelRatio;ctx.beginPath();ctx.arc(n.x*w,n.y*h,32*devicePixelRatio,-Math.PI/2,-Math.PI/2+prog*2*Math.PI);ctx.stroke();}
  ctx.save();ctx.translate(n.x*w,n.y*h);ctx.scale(-1,1);ctx.fillStyle="#0b0f2e";ctx.font=`800 ${22*devicePixelRatio}px Unbounded, sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(label,0,1);ctx.restore();
  if(raise){ // подсказка: какую сторону камера видит прямо сейчас (рисуем в зеркальных координатах)
    ctx.save();ctx.translate(n.x*w,n.y*h-60*devicePixelRatio);ctx.scale(-1,1);
    ctx.fillStyle="#ffd84d";ctx.font=`800 ${34*devicePixelRatio}px Unbounded, sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(raise==="L"?"←":"→",0,0);ctx.restore();}
}
function draw(){
  canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio;ctx.clearRect(0,0,canvas.width,canvas.height);
  const now=performance.now();
  guests.forEach(g=>drawBody(g.lm,GREY,"?",g.prog||0));
  profiles.filter(p=>now-p.last<400).forEach(p=>drawBody(p.lm,COLORS[p.id-1],String(p.id),0,p.raise));
}
let lastSig="";
function renderPlayers(){
  const now=performance.now();
  const sig=profiles.map(p=>p.id+":"+(now-p.last<400?1:0)).sort().join(",")+mode+myId+L;
  if(sig===lastSig)return;lastSig=sig;
  $("pls").innerHTML=[1,2,3,4].map(i=>{const p=profiles.find(x=>x.id===i),seen=p&&now-p.last<400;
    return `<div class="pl ${seen?"on":""} ${p?"saved":""}" style="color:${COLORS[i-1]}">${tx("player")} ${i}${p?`<span style="color:var(--ink2);font-weight:600">${tx("saved")}</span>`:""}${mode==="shared"?`<button type="button" data-save="${i}">${tx("save")}</button>`:""}</div>`;}).join("");
  document.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{if(saveManual(+b.dataset.save)){lastSig="";renderPlayers();}});
}
let bannerUntil=0;
function setBanner(t){$("banner").textContent=t;bannerUntil=performance.now()+2500;}
function updateBanner(n){
  if(performance.now()<bannerUntil)return;
  let t;if(!n)t=tx("bNone");else if(phase==="game")t=tx("bPlay");else if(mode==="shared"&&!freeId()&&guests.length)t=tx("bFull");else if(mode==="shared")t=tx("bReg");else t=tx("bPlay");
  $("banner").textContent=t;
}

/* ================== СВЯЗЬ С ЭКРАНОМ ================== */
let peer=null,conn=null;
const anyOpen=()=>conn&&conn.open;
const send=m=>{try{conn.send(m);}catch(e){}};
function setStatus(t,ok){$("statusTxt").textContent=t;$("status").classList.toggle("ok",!!ok);}
async function join(){
  const code=($("code").value||"").replace(/\D/g,"");
  if(code.length!==4){setStatus(tx("badCode"));return;}
  $("joinBtn").disabled=true;setStatus(tx("connecting"));
  try{await startCamera();}catch(e){setStatus(tx("errCam"));$("joinBtn").disabled=false;return;}
  ["camBox","pls","tools"].forEach(id=>$(id).classList.remove("hidden"));lastSig="";renderPlayers();
  if(!landmarker){setStatus(tx("loading"));try{await initPose();}catch(e){setStatus(tx("errModel"));$("joinBtn").disabled=false;return;}loop();}
  connect(code);
}
function connect(code){
  if(peer)try{peer.destroy();}catch(e){}
  peer=new Peer();
  peer.on("open",()=>{
    conn=peer.connect("shq-fam-"+code,{serialization:"json"});
    const to=setTimeout(()=>{if(!conn.open){setStatus(tx("noScreen"));$("joinBtn").disabled=false;}},12000);
    conn.on("open",()=>{clearTimeout(to);setStatus(tx("on"),true);$("joinCard").classList.add("hidden");send({t:"hello",mode,myId});});
    conn.on("close",()=>{setStatus(tx("lost"));$("joinCard").classList.remove("hidden");$("joinBtn").disabled=false;});
    conn.on("data",m=>{if(!m)return;if(m.t==="lang"&&TX[m.lang]){L=m.lang;applyLang();}if(m.t==="phase")phase=m.phase;});
  });
  peer.on("error",e=>{setStatus(e.type==="peer-unavailable"?tx("noScreen"):tx("lost"));$("joinBtn").disabled=false;});
}

/* ================== КНОПКИ ================== */
function applyLang(){document.documentElement.lang=L==="kz"?"kk":"ru";document.querySelectorAll("[data-t]").forEach(e=>e.textContent=tx(e.dataset.t));
  document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("on",b.dataset.lang===L));
  $("hint").textContent=mode==="shared"?tx("hintShared"):tx("hintPersonal");
  $("myIdSeg").innerHTML=[1,2,3,4].map(i=>`<button type="button" data-my="${i}" class="${i===myId?"on":""}" style="${i===myId?`background:${COLORS[i-1]};color:#0b0f2e`:""}">${i}</button>`).join("");
  document.querySelectorAll("[data-my]").forEach(b=>b.onclick=()=>{myId=+b.dataset.my;profiles=[];applyLang();});
  lastSig="";renderPlayers();if(!$("statusTxt").textContent)setStatus(tx("off"));}
if(qs.get("room"))$("code").value=qs.get("room").replace(/\D/g,"").slice(0,4);
$("joinBtn").onclick=join;
$("code").addEventListener("keydown",e=>{if(e.key==="Enter")join();});
$("resetBtn").onclick=()=>{profiles=[];guests=[];events.push({t:"reset"});lastSig="";renderPlayers();};
$("flipBtn").onclick=async()=>{facing=facing==="user"?"environment":"user";try{await startCamera();}catch(e){setStatus(tx("errCam"));}};
document.querySelectorAll("[data-cam]").forEach(b=>b.onclick=()=>{facing=b.dataset.cam;document.querySelectorAll("[data-cam]").forEach(x=>x.classList.toggle("on",x===b));});
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("on",x===b));$("myIdRow").classList.toggle("hidden",mode!=="personal");profiles=[];guests=[];applyLang();});
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{L=b.dataset.lang;applyLang();});
applyLang();setStatus(tx("off"));
</script>
